name: Q4OS Trinity - DeepHat Advanced RDP

on:
  workflow_dispatch:

jobs:
  q4os-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    env:
      VM_NAME: q4os-mobile
      VM_DIR: /home/runner/q4os

      RAM_MB: 1024
      CPU_CORES: 2
      DISK_SIZE: 145G

      Q4OS_USER: ZynexDEX
      Q4OS_PASSWORD: ZynexDEX123!

      VNC_DISPLAY: 0
      VNC_PORT: 5900
      NOVNC_PORT: 6080
      RDP_PORT: 3389

      Q4OS_ISO: q4os-6.9-x64-instcd.r1.iso
      Q4OS_ISO_URL: https://sourceforge.net/projects/q4os/files/stable/q4os-6.9-x64-instcd.r1.iso/download

    steps:

      # =========================================================
      # 01 - SYSTEM INFORMATION
      # =========================================================

      - name: System Information
        run: |
          echo "===================================================="
          echo "          DEEPHAT Q4OS SYSTEM INITIALIZER"
          echo "===================================================="

          echo "Runner:"
          uname -a

          echo ""
          echo "CPU:"
          nproc

          echo ""
          echo "Memory:"
          free -h

          echo ""
          echo "Storage:"
          df -h

          echo "===================================================="

      # =========================================================
      # 02 - INSTALL DEPENDENCIES
      # =========================================================

      - name: Install Dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            wget \
            curl \
            git \
            python3 \
            python3-pip \
            xz-utils \
            net-tools \
            iproute2 \
            procps \
            jq

          echo "===================================================="
          echo "DEPENDENCIES INSTALLED"
          echo "===================================================="

          qemu-system-x86_64 --version
          qemu-img --version
          python3 --version
          curl --version | head -n 1

      # =========================================================
      # 03 - CREATE WORKSPACE
      # =========================================================

      - name: Prepare Q4OS Workspace
        run: |
          set -e

          mkdir -p "$VM_DIR"
          mkdir -p "$VM_DIR/logs"
          mkdir -p "$VM_DIR/scripts"
          mkdir -p "$VM_DIR/novnc"

          echo "Workspace:"
          find "$VM_DIR" -maxdepth 1 -type d -print

      # =========================================================
      # 04 - DOWNLOAD Q4OS
      # =========================================================

      - name: Download Q4OS
        run: |
          set -e

          cd "$VM_DIR"

          echo "Downloading Q4OS..."

          wget \
            --progress=bar:force \
            --tries=3 \
            --timeout=60 \
            -O "$Q4OS_ISO" \
            "$Q4OS_ISO_URL"

          if [ ! -f "$Q4OS_ISO" ]; then
            echo "Q4OS ISO was not downloaded."
            exit 1
          fi

          ISO_SIZE=$(du -h "$Q4OS_ISO" | cut -f1)

          echo "Q4OS ISO:"
          echo "$Q4OS_ISO"
          echo "Size: $ISO_SIZE"

      # =========================================================
      # 05 - VALIDATE ISO
      # =========================================================

      - name: Validate Q4OS ISO
        run: |
          set -e

          cd "$VM_DIR"

          if [ ! -s "$Q4OS_ISO" ]; then
            echo "ISO file is empty."
            exit 1
          fi

          file "$Q4OS_ISO"

          echo ""
          echo "ISO validation completed."

      # =========================================================
      # 06 - CREATE 145GB QCOW2 DISK
      # =========================================================

      - name: Create 145GB Virtual Disk
        run: |
          set -e

          DISK="$VM_DIR/$VM_NAME.qcow2"

          if [ -f "$DISK" ]; then
            echo "Existing disk found."
          else
            echo "Creating 145GB QCOW2 disk..."

            qemu-img create \
              -f qcow2 \
              -o lazy_refcounts=on \
              "$DISK" \
              "$DISK_SIZE"
          fi

          echo "===================================================="
          echo "VIRTUAL DISK INFORMATION"
          echo "===================================================="

          qemu-img info "$DISK"

      # =========================================================
      # 07 - CREATE VM CONFIGURATION
      # =========================================================

      - name: Generate VM Configuration
        run: |
          cat > "$VM_DIR/vm-info.txt" <<EOF
          VM_NAME=$VM_NAME
          RAM_MB=$RAM_MB
          CPU_CORES=$CPU_CORES
          DISK_SIZE=$DISK_SIZE
          Q4OS_USER=$Q4OS_USER
          VNC_PORT=$VNC_PORT
          NOVNC_PORT=$NOVNC_PORT
          RDP_PORT=$RDP_PORT
          EOF

          cat "$VM_DIR/vm-info.txt"

      # =========================================================
      # 08 - START QEMU
      # =========================================================

      - name: Start Q4OS Virtual Machine
        run: |
          set -e

          cd "$VM_DIR"

          QEMU_LOG="$VM_DIR/logs/qemu.log"

          nohup qemu-system-x86_64 \
            -name "$VM_NAME" \
            -machine q35 \
            -accel tcg,thread=multi \
            -m "$RAM_MB" \
            -smp "$CPU_CORES" \
            -cpu max \
            -drive file="$VM_NAME.qcow2",format=qcow2,if=virtio,cache=writeback \
            -cdrom "$Q4OS_ISO" \
            -boot order=d \
            -vga virtio \
            -display none \
            -vnc "0.0.0.0:$VNC_DISPLAY" \
            -netdev user,id=net0,hostfwd=tcp::${RDP_PORT}-:3389 \
            -device virtio-net-pci,netdev=net0 \
            -monitor none \
            > "$QEMU_LOG" 2>&1 &

          QEMU_PID=$!

          echo "$QEMU_PID" > "$VM_DIR/qemu.pid"

          sleep 10

          if kill -0 "$QEMU_PID" 2>/dev/null; then
            echo "QEMU STATUS: ONLINE"
            echo "QEMU PID: $QEMU_PID"
          else
            echo "QEMU failed to start."
            cat "$QEMU_LOG"
            exit 1
          fi

      # =========================================================
      # 09 - CHECK VM PROCESS
      # =========================================================

      - name: Verify Virtual Machine
        run: |
          if [ ! -f "$VM_DIR/qemu.pid" ]; then
            echo "QEMU PID file missing."
            exit 1
          fi

          PID=$(cat "$VM_DIR/qemu.pid")

          if kill -0 "$PID" 2>/dev/null; then
            echo "===================================================="
            echo "Q4OS VM ONLINE"
            echo "PID: $PID"
            echo "===================================================="
          else
            echo "Q4OS VM is not running."
            exit 1
          fi

      # =========================================================
      # 10 - INSTALL NOVNC
      # =========================================================

      - name: Install noVNC
        run: |
          set -e

          cd "$VM_DIR"

          if [ ! -d "$VM_DIR/novnc/.git" ]; then
            git clone \
              --depth 1 \
              https://github.com/novnc/noVNC.git \
              "$VM_DIR/novnc"
          fi

          if [ -f "$VM_DIR/novnc/utils/novnc_proxy" ]; then
            echo "noVNC installed successfully."
          else
            echo "noVNC installation failed."
            exit 1
          fi

      # =========================================================
      # 11 - START NOVNC
      # =========================================================

      - name: Start noVNC
        run: |
          set -e

          NOVNC_LOG="$VM_DIR/logs/novnc.log"

          cd "$VM_DIR/novnc"

          nohup ./utils/novnc_proxy \
            --vnc "127.0.0.1:$VNC_PORT" \
            --listen "0.0.0.0:$NOVNC_PORT" \
            > "$NOVNC_LOG" 2>&1 &

          NOVNC_PID=$!

          echo "$NOVNC_PID" > "$VM_DIR/novnc.pid"

          sleep 5

          if kill -0 "$NOVNC_PID" 2>/dev/null; then
            echo "noVNC STATUS: ONLINE"
            echo "PID: $NOVNC_PID"
          else
            echo "noVNC failed to start."
            cat "$NOVNC_LOG"
            exit 1
          fi

      # =========================================================
      # 12 - INSTALL TAILSCALE
      # =========================================================

      - name: Install Tailscale
        run: |
          set -e

          curl -fsSL https://tailscale.com/install.sh | sh

          sudo systemctl enable --now tailscaled

          sleep 3

          tailscale version

      # =========================================================
      # 13 - CONNECT TAILSCALE
      # =========================================================

      - name: Establish Tailscale Connection
        run: |
          set -e

          if [ -z "${{ secrets.TAILSCALE_AUTH_KEY }}" ]; then
            echo "TAILSCALE_AUTH_KEY secret is missing."
            exit 1
          fi

          sudo tailscale up \
            --auth-key="${{ secrets.TAILSCALE_AUTH_KEY }}" \
            --hostname="gh-q4os-${GITHUB_RUN_ID}"

          sleep 5

          TS_IP=$(tailscale ip -4 | head -n 1)

          if [ -z "$TS_IP" ]; then
            echo "Tailscale IP was not assigned."
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"

          echo "===================================================="
          echo "TAILSCALE ONLINE"
          echo "IP: $TS_IP"
          echo "===================================================="

      # =========================================================
      # 14 - CHECK NETWORK
      # =========================================================

      - name: Network Diagnostics
        run: |
          echo "===================================================="
          echo "NETWORK DIAGNOSTICS"
          echo "===================================================="

          echo "Tailscale:"
          tailscale status || true

          echo ""
          echo "Interfaces:"
          ip addr

          echo ""
          echo "Listening ports:"
          ss -lntp || true

      # =========================================================
      # 15 - PREPARE LOGIN DATA
      # =========================================================

      - name: Prepare RDP Credentials
        shell: pwsh
        env:
          USERNAME: ${{ env.Q4OS_USER }}
          PASSWORD: ${{ env.Q4OS_PASSWORD }}
        run: |
          $user = $env:USERNAME
          $pass = $env:PASSWORD

          "RDP_USER=$user" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RDP_PASSWORD=$pass" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host "RDP credentials prepared."

      # =========================================================
      # 16 - SESSION INFORMATION
      # =========================================================

      - name: SESSION ACTIVE
        shell: pwsh
        env:
          USERNAME: ${{ env.Q4OS_USER }}
          PASSWORD: ${{ env.Q4OS_PASSWORD }}
          TAILSCALE_IP: ${{ env.TAILSCALE_IP }}
        run: |
          $ip = $env:TAILSCALE_IP
          $user = $env:USERNAME
          $pass = $env:PASSWORD

          Write-Host "===================================================="
          Write-Host "        🚀 SESSION ACTIVE - DEEPHAT TUNED 🚀        "
          Write-Host "===================================================="
          Write-Host "  [+] IP ADDRESS:     $ip"
          Write-Host "  [+] USERNAME:       $user"
          Write-Host "  [+] PASSWORD:       $pass"
          Write-Host "===================================================="
          Write-Host "  [+] STORAGE:        145GB (VIRTUAL EXPANSION)"
          Write-Host "  [+] MODE:           GAMING OVERDRIVE (DEBLOATED)"
          Write-Host "===================================================="
          Write-Host "  [!] STATUS:         ONLINE"
          Write-Host "===================================================="
          Write-Host "  [!] DICA: Use o Windows App para conectar."
          Write-Host "===================================================="

      # =========================================================
      # 17 - CONNECTION TEST
      # =========================================================

      - name: Test Local Services
        run: |
          echo "===================================================="
          echo "SERVICE CHECK"
          echo "===================================================="

          echo "QEMU:"
          if kill -0 "$(cat "$VM_DIR/qemu.pid")" 2>/dev/null; then
            echo "ONLINE"
          else
            echo "OFFLINE"
            exit 1
          fi

          echo ""
          echo "noVNC:"
          if kill -0 "$(cat "$VM_DIR/novnc.pid")" 2>/dev/null; then
            echo "ONLINE"
          else
            echo "OFFLINE"
          fi

          echo ""
          echo "Ports:"
          ss -lnt | grep -E ":5900|:6080|:3389" || true

      # =========================================================
      # 18 - CREATE SESSION REPORT
      # =========================================================

      - name: Create Session Report
        run: |
          cat > "$VM_DIR/session-report.txt" <<EOF
          ==========================================
                    DEEPHAT Q4OS SESSION
          ==========================================

          VM:
          $VM_NAME

          RAM:
          ${RAM_MB}MB

          CPU:
          $CPU_CORES

          STORAGE:
          $DISK_SIZE

          USERNAME:
          $Q4OS_USER

          TAILSCALE IP:
          $TAILSCALE_IP

          VNC:
          $VNC_PORT

          noVNC:
          $NOVNC_PORT

          RDP:
          $RDP_PORT

          STATUS:
          ONLINE

          ==========================================
          EOF

          cat "$VM_DIR/session-report.txt"

      # =========================================================
      # 19 - MONITOR VM
      # =========================================================

      - name: Monitor Q4OS
        run: |
          set -e

          echo "===================================================="
          echo "Q4OS MONITOR STARTED"
          echo "===================================================="

          while true
          do
            if ! kill -0 "$(cat "$VM_DIR/qemu.pid")" 2>/dev/null
            then
              echo "QEMU STOPPED."
              echo ""
              echo "===== QEMU LOG ====="
              cat "$VM_DIR/logs/qemu.log" || true
              exit 1
            fi

            if [ -f "$VM_DIR/novnc.pid" ]; then
              if ! kill -0 "$(cat "$VM_DIR/novnc.pid")" 2>/dev/null
              then
                echo "noVNC STOPPED."
              fi
            fi

            echo "[$(date)] Q4OS VM ONLINE | Tailscale: $TAILSCALE_IP"

            sleep 300
          done

      # =========================================================
      # 20 - UPLOAD LOGS
      # =========================================================

      - name: Save DeepHat Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DeepHat-Q4OS-Session
          path: |
            /home/runner/q4os/logs/
            /home/runner/q4os/session-report.txt
            /home/runner/q4os/vm-info.txt
          retention-days: 1
