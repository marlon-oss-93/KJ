name: Q4OS - DeepHat RDP

on:
  workflow_dispatch:

jobs:
  q4os-rdp:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    env:
      VM_NAME: q4os-mobile
      RAM: 1024
      CPUS: 2
      DISK_SIZE: 145G

      Q4OS_USER: ZynexDEX
      Q4OS_PASSWORD: ZynexDEX123!

      RDP_PORT: 3389

    steps:

      # =========================================================
      # INSTALL DEPENDENCIES
      # =========================================================

      - name: Install Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            wget \
            curl \
            git \
            xz-utils

          echo "Dependencies installed."

      # =========================================================
      # DOWNLOAD Q4OS
      # =========================================================

      - name: Download Q4OS
        run: |
          mkdir -p "$HOME/q4os"

          wget --show-progress \
            -O "$HOME/q4os/q4os.iso" \
            "https://sourceforge.net/projects/q4os/files/stable/q4os-6.9-x64-instcd.r1.iso/download"

          echo "Q4OS downloaded successfully."

      # =========================================================
      # CREATE 145GB VIRTUAL DISK
      # =========================================================

      - name: Create Virtual Disk
        run: |
          qemu-img create \
            -f qcow2 \
            "$HOME/q4os/$VM_NAME.qcow2" \
            "$DISK_SIZE"

          echo "=========================================="
          echo "Q4OS VIRTUAL DISK"
          echo "=========================================="

          qemu-img info "$HOME/q4os/$VM_NAME.qcow2"

      # =========================================================
      # START QEMU
      # =========================================================

      - name: Start Q4OS
        run: |
          cd "$HOME/q4os"

          nohup qemu-system-x86_64 \
            -name "$VM_NAME" \
            -machine q35 \
            -accel tcg,thread=multi \
            -m "$RAM" \
            -smp "$CPUS" \
            -cpu max \
            -drive file="$VM_NAME.qcow2",format=qcow2,if=virtio \
            -cdrom q4os.iso \
            -boot order=d \
            -vga virtio \
            -display none \
            -vnc 0.0.0.0:0 \
            -netdev user,id=net0 \
            -device virtio-net-pci,netdev=net0 \
            > "$HOME/q4os/qemu.log" 2>&1 &

          echo $! > "$HOME/q4os/qemu.pid"

          sleep 10

          if kill -0 "$(cat "$HOME/q4os/qemu.pid")" 2>/dev/null; then
            echo "QEMU started successfully."
          else
            echo "QEMU failed to start."
            cat "$HOME/q4os/qemu.log"
            exit 1
          fi

      # =========================================================
      # INSTALL TAILSCALE
      # =========================================================

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

          sudo systemctl enable --now tailscaled

          echo "Tailscale installed."

      # =========================================================
      # ESTABLISH TAILSCALE CONNECTION
      # =========================================================

      - name: Establish Tailscale Connection
        run: |
          if [ -z "${{ secrets.TAILSCALE_AUTH_KEY }}" ]; then
            echo "TAILSCALE_AUTH_KEY secret is missing."
            exit 1
          fi

          sudo tailscale up \
            --auth-key="${{ secrets.TAILSCALE_AUTH_KEY }}" \
            --hostname="gh-q4os-${GITHUB_RUN_ID}"

          sleep 5

          TS_IP="$(tailscale ip -4 | head -n 1)"

          if [ -z "$TS_IP" ]; then
            echo "Tailscale IP not assigned."
            exit 1
          fi

          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"

          echo "Tailscale IP: $TS_IP"

      # =========================================================
      # CREATE LOGIN INFORMATION
      # =========================================================

      - name: Create RDP User with Secure Password
        shell: pwsh
        env:
          Q4OS_USER: ${{ env.Q4OS_USER }}
          Q4OS_PASSWORD: ${{ env.Q4OS_PASSWORD }}
        run: |
          $user = $env:Q4OS_USER
          $pass = $env:Q4OS_PASSWORD

          echo "RDP_USER=$user" >> $env:GITHUB_ENV
          echo "RDP_PASSWORD=$pass" >> $env:GITHUB_ENV

          Write-Host "RDP credentials configured."

      # =========================================================
      # VERIFY TAILSCALE
      # =========================================================

      - name: Verify RDP Accessibility
        run: |
          echo "=========================================="
          echo "TAILSCALE CONNECTION"
          echo "=========================================="
          echo "IP: $TAILSCALE_IP"
          echo "=========================================="

          if [ -z "$TAILSCALE_IP" ]; then
            echo "Tailscale IP is empty."
            exit 1
          fi

          echo "Tailscale connection successful."

      # =========================================================
      # RDP ACCESS
      # =========================================================

      - name: Maintain Connection
        shell: pwsh
        env:
          TAILSCALE_IP: ${{ env.TAILSCALE_IP }}
          RDP_USER: ${{ env.Q4OS_USER }}
          RDP_PASSWORD: ${{ env.Q4OS_PASSWORD }}
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USER"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "==================`n"

          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }

      # =========================================================
      # KEEP QEMU ALIVE
      # =========================================================

      - name: Keep QEMU Alive
        run: |
          while true
          do
            if ! kill -0 "$(cat "$HOME/q4os/qemu.pid")" 2>/dev/null
            then
              echo "QEMU STOPPED."
              exit 1
            fi

            echo "[$(date)] Q4OS VM active."

            sleep 60
          done

      # =========================================================
      # SAVE LOGS
      # =========================================================

      - name: Save Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DeepHat-Q4OS-Logs
          path: |
            $HOME/q4os/qemu.log
          retention-days: 1
