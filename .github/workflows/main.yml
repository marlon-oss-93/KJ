name: RDP + Linux (Debian) Setup

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      # =========================================================
      # 1. DISCO VIRTUAL (D: e E:)
      # =========================================================
      - name: Create Virtual Disks
        shell: powershell
        run: |
          $vhdPathD = "C:\RDP-Storage-D.vhdx"
          $vhdPathE = "C:\RDP-Storage-E.vhdx"
          $diskpartScript = "C:\vhd_script.txt"

          if (Test-Path $vhdPathD) { Remove-Item $vhdPathD -Force -ErrorAction SilentlyContinue }
          if (Test-Path $vhdPathE) { Remove-Item $vhdPathE -Force -ErrorAction SilentlyContinue }
          if (Test-Path $diskpartScript) { Remove-Item $diskpartScript -Force -ErrorAction SilentlyContinue }

          Write-Host "Criando comandos Diskpart..."
          $cmds = @(
            "create vdisk file=`"$vhdPathD`" maximum=307200 type=expandable",
            "select vdisk file=`"$vhdPathD`"",
            "attach vdisk",
            "clean",
            "create partition primary",
            "format fs=ntfs quick label=RDP_D",
            "assign letter=D",
            "exit",
            "create vdisk file=`"$vhdPathE`" maximum=307200 type=expandable",
            "select vdisk file=`"$vhdPathE`"",
            "attach vdisk",
            "clean",
            "create partition primary",
            "format fs=ntfs quick label=RDP_E",
            "assign letter=E",
            "exit"
          )

          foreach ($c in $cmds) { $c | Out-File -FilePath $diskpartScript -Append -Encoding ASCII }
          diskpart /s $diskpartScript | Out-Null
          Start-Sleep -Seconds 20
          Write-Host "Discos D: e E: prontos."

      # =========================================================
      # 2. INSTALAÇÃO DO LINUX (WSL / DEBIAN)
      # =========================================================
      - name: Install WSL and Debian
        shell: powershell
        run: |
          Write-Host "Ativando WSL..."
          dism.exe /online /enable-feature /featurename:Microsoft-Windows-Subsystem-Linux /all /norestart
          dism.exe /online /enable-feature /featurename:VirtualMachinePlatform /all /norestart
          
          Write-Host "Instalando Debian (isso pode demorar)..."
          wsl --install -d Debian --no-launch
          
          Write-Host "WSL e Debian configurados!"

      # =========================================================
      # 3. CONFIGURAR RDP E TEMA ESCURO
      # =========================================================
      - name: Configure RDP and Dark Mode
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          
          $registryPath = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes/Personalization"
          if (-not (Test-Path $registryPath)) { New-Item -Path $registryPath -Force }
          Set-ItemProperty -Path $registryPath -Name "SystemUsesLightTheme" -Value 0 -Force
          Set-ItemProperty -Path $registryPath -Name "AppsUseLightTheme" -Value 0 -Force
          
          Restart-Service -Name TermService -Force
          Write-Host "RDP e Dark Mode configurados."

      # =========================================================
      # 4. USUARIO RDP (ZynexDEX)
      # =========================================================
      - name: Create RDP User
        shell: powershell
        run: |
          $chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789"
          $password = ""
          for ($i=0; $i -lt 16; $i++) { $password += $chars[(Get-Random -Maximum $chars.Length)] }
          $userName = "ZynexDEX"
          
          if (Get-LocalUser -Name $userName -ErrorAction SilentlyContinue) { Remove-LocalUser -Name $userName }

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name $userName -Password $securePass -AccountNeverExpires -FullName "RDP Admin"
          Add-LocalGroupMember -Group "Administrators" -Member $userName
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $userName

          echo "RDP_USER=$userName" >> $env:GITHUB_ENV
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV
          
          Write-Host "-------------------------------------------"
          Write-Host "USUARIO: $userName"
          Write-Host "SENHA: $password"
          Write-Host "-------------------------------------------"

      # =========================================================
      # 5. TAILSCALE
      # =========================================================
      - name: Install Tailscale
        shell: powershell
        run: |
          $installerPath = "$env:TEMP\tailscale-setup.msi"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i `"$installerPath`" /quiet /norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $tsExe up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID

          $tsIP = $null
          for ($i=0; $i -lt 15; $i++) {
              $tsIP = & $tsExe ip -4
              if ($tsIP) { $tsIP = $tsIP.Trim(); break }
              Write-Host "Aguardando IP..."
              Start-Sleep -Seconds 10
          }

          if (-not $tsIP) { exit 1 }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "IP Tailscale: $tsIP"

      # =========================================================
      # 6. MANTER CONEXÃO ATIVA
      # =========================================================
      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "          RDP SESSION ACTIVE"
          Write-Host "=========================================="
          Write-Host "IP: $env:TAILSCALE_IP"
          Write-Host "User: $env:RDP_USER"
          Write-Host "Pass: $env:RDP_PASSWORD"
          Write-Host "=========================================="
          
          while ($true) {
              $diskD = Get-Volume -DriveLetter D -ErrorAction SilentlyContinue
              $diskE = Get-Volume -DriveLetter E -ErrorAction SilentlyContinue
              
              $statusD = if ($diskD) { "Online" } else { "Offline" }"
              $statusE = if ($diskE) { "Online" } else { "Offline" }"

              Write-Host "[$(Get-Date)] Status: Online | D: $statusD | E: $statusE"
              Start-Sleep -Seconds 300
          }
