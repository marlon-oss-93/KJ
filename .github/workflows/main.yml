name: RDP - CyberNexus Final (Fix Drive Letter)

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      # =========================================================
      # 1. DISCO VIRTUAL (USANDO F: E G: PARA EVITAR CONFLITO)
      # =========================================================
      - name: Create Virtual Disks (F: and G:)
        shell: powershell
        run: |
          $vhdPathF = "C:\RDP-Storage-F.vhdx"
          $vhdPathG = "C:\RDP-Storage-G.vhdx"
          $diskpartScript = "C:\vhd_script.txt"

          if (Test-Path $vhdPathF) { Remove-Item $vhdPathF -Force -ErrorAction SilentlyContinue }
          if (Test-Path $vhdPathG) { Remove-Item $vhdPathG -Force -ErrorAction SilentlyContinue }
          if (Test-Path $diskpartScript) { Remove-Item $diskpartScript -Force -ErrorAction SilentlyContinue }

          Write-Host "Criando comandos Diskpart para F: e G:..."
          
          $cmds = @(
            "create vdisk file=`"$vhdPathF`" maximum=307200 type=expandable",
            "select vdisk file=`"$vhdPathF`"",
            "attach vdisk",
            "clean",
            "create partition primary",
            "format fs=ntfs quick label=RDP_F",
            "assign letter=F",
            "exit",
            "create vdisk file=`"$vhdPathG`" maximum=307200 type=expandable",
            "select vdisk file=`"$vhdPathG`"",
            "attach vdisk",
            "clean",
            "create partition primary",
            "format fs=ntfs quick label=RDP_G",
            "assign letter=G",
            "exit"
          )

          foreach ($c in $cmds) { $c | Out-File -FilePath $diskpartScript -Append -Encoding ASCII }

          Write-Host "Executando Diskpart... (Isso pode demorar)"
          $output = diskpart /s $diskpartScript 2>&1
          Write-Host $output

          Start-Sleep -Seconds 20

          # Verificação de segurança
          if (-not (Test-Path "F:\") -or -not (Test-Path "G:\")) {
              Write-Host "Tentando reparo de montagem..."
              $repair = "select vdisk file=`"$vhdPathF`"; attach vdisk; online disk; assign letter=F; select vdisk file=`"$vhdPathG`"; attach vdisk; online disk; assign letter=G"
              $repair | diskpart
          }
          Write-Host "Discos F: e G: verificados."

      # =========================================================
      # 2. CONFIGURAR RDP E TEMA ESCURO
      # =========================================================
      - name: Configure RDP and Dark Mode
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          
          $registryPath = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalization"
          if (-not (Test-Path $registryPath)) { New-Item -Path $registryPath -Force }
          Set-ItemProperty -Path $registryPath -Name "SystemUsesLightTheme" -Value 0 -Force
          Set-ItemProperty -Path $registryPath -Name "AppsUseLightTheme" -Value 0 -Force
          
          Restart-Service -Name TermService -Force
          Write-Host "RDP e Dark Mode configurados."

      # =========================================================
      # 3. USUARIO RDP (ZynexDEX)
      # =========================================================
      - name: Create RDP User
        shell: powershell
        run: |
          $chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789"
          $password = ""
          for ($i=0; $i -lt 16; $i++) { $password += $chars[(Get-Random -Maximum $chars.Length)] }
          
          $userName = "ZynexDEX"
          if (Get-LocalUser -Name $userName -ErrorAction SilentlyContinue) { Remove-LocalUser -Name $userName }

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name $userName -Password $securePass -AccountNeverExpires -FullName "RDP Admin"
          Add-LocalGroupMember -Group "Administrators" -Member $userName
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $userName

          echo "RDP_USER=$userName" >> $env:GITHUB_ENV
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV
          
          Write-Host "-------------------------------------------"
          Write-Host "USUARIO: $userName"
          Write-Host "SENHA: $password"
          Write-Host "-------------------------------------------"
          Write-Host "::add-mask::$password"

      # =========================================================
      # 4. TAILSCALE
      # =========================================================
      - name: Install Tailscale
        shell: powershell
        run: |
          $installerPath = "$env:TEMP\tailscale-setup.msi"
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i `"$installerPath`" /quiet /norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $tsExe up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID

          $tsIP = $null
          for ($i=0; $i -lt 15; $i++) {
              $tsIP = & $tsExe ip -4
              if ($tsIP) { break }
              Write-Host "Aguardando IP..."
              Start-Sleep -Seconds 10
          }

          if (-not $tsIP) { exit 1 }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "IP Tailscale: $tsIP"

      # =========================================================
      # 5. MANTER CONEXÃO ATIVA
      # =========================================================
      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "          RDP SESSION ACTIVE"
          Write-Host "=========================================="
          Write-Host "IP: $env:TAILSCALE_IP"
          Write-Host "User: $env:RDP_USER"
          Write-Host "Pass: $env:RDP_PASSWORD"
          Write-Host "=========================================="
          
          while ($true) {
              $diskF = Get-Volume -DriveLetter F -ErrorAction SilentlyContinue
              $diskG = Get-Volume -DriveLetter G -ErrorAction SilentlyContinue
              
              $statusF = if ($diskF) { "$([math]::Round($diskF.SizeRemaining / 1GB, 2)) GB livre" } else { "Offline" }"
              $statusG = if ($diskG) { "$([math]::Round($diskG.SizeRemaining / 1GB, 2)) GB livre" } else { "Offline" }"

              Write-Host "[$(Get-Date)] Status: Online | F: $statusF | G: $statusG"
              Start-Sleep -Seconds 300
          }
