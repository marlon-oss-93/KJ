name: Q4OS Trinity - DeepHat Mobile PC

on:
  workflow_dispatch:

jobs:
  q4os:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    env:
      VM_NAME: q4os-mobile
      RAM: 1024
      CPUS: 2
      DISK_SIZE: 145G

      USERNAME: ZynexDEX
      PASSWORD: ZynexDEX123!

      VNC_PORT: 5900
      NOVNC_PORT: 6080

      ISO_URL: https://sourceforge.net/projects/q4os/files/stable/q4os-6.9-x64-instcd.r1.iso/download
      ISO_NAME: q4os-6.9-x64-instcd.r1.iso

    steps:

      # =====================================================
      # 1. PREPARAR AMBIENTE
      # =====================================================
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            wget \
            curl \
            git \
            python3

      # =====================================================
      # 2. BAIXAR Q4OS
      # =====================================================
      - name: Download Q4OS
        run: |
          mkdir -p "$HOME/q4os"

          wget \
            --show-progress \
            -O "$HOME/q4os/$ISO_NAME" \
            "$ISO_URL"

          echo "Q4OS downloaded successfully."

      # =====================================================
      # 3. CRIAR DISCO VIRTUAL 145 GB
      # =====================================================
      - name: Create Virtual Disk
        run: |
          qemu-img create \
            -f qcow2 \
            "$HOME/q4os/$VM_NAME.qcow2" \
            "$DISK_SIZE"

          echo "Virtual disk created:"
          qemu-img info "$HOME/q4os/$VM_NAME.qcow2"

      # =====================================================
      # 4. INICIAR QEMU
      # =====================================================
      - name: Start QEMU
        run: |
          cd "$HOME/q4os"

          nohup qemu-system-x86_64 \
            -name "$VM_NAME" \
            -machine q35 \
            -accel tcg,thread=multi \
            -m "$RAM" \
            -smp "$CPUS" \
            -cpu max \
            -drive file="$VM_NAME.qcow2",format=qcow2,if=virtio \
            -cdrom "$ISO_NAME" \
            -boot order=d \
            -vga virtio \
            -display none \
            -vnc 0.0.0.0:0 \
            -netdev user,id=net0 \
            -device virtio-net-pci,netdev=net0 \
            > "$HOME/q4os/qemu.log" 2>&1 &

          echo $! > "$HOME/q4os/qemu.pid"

          sleep 10

          echo "QEMU started."

      # =====================================================
      # 5. INSTALAR NOVNC
      # =====================================================
      - name: Setup noVNC
        run: |
          cd "$HOME/q4os"

          git clone --depth 1 \
            https://github.com/novnc/noVNC.git \
            novnc

          cd novnc

          nohup ./utils/novnc_proxy \
            --vnc localhost:$VNC_PORT \
            --listen 0.0.0.0:$NOVNC_PORT \
            > "$HOME/q4os/novnc.log" 2>&1 &

          echo $! > "$HOME/q4os/novnc.pid"

          sleep 5

          echo "noVNC started."

      # =====================================================
      # 6. SESSION ACTIVE
      # =====================================================
      - name: SESSION ACTIVE
        shell: pwsh
        env:
          USERNAME: ${{ env.USERNAME }}
          PASSWORD: ${{ env.PASSWORD }}
        run: |
          $ip = (Invoke-RestMethod -Uri "https://api.ipify.org").Trim()
          $user = $env:USERNAME
          $pass = $env:PASSWORD

          Write-Host "===================================================="
          Write-Host "        🚀 SESSION ACTIVE - DEEPHAT TUNED 🚀        "
          Write-Host "===================================================="
          Write-Host "  [+] IP ADDRESS:     $ip"
          Write-Host "  [+] USERNAME:       $user"
          Write-Host "  [+] PASSWORD:       $pass"
          Write-Host "===================================================="
          Write-Host "  [+] STORAGE:        145GB (VIRTUAL EXPANSION)"
          Write-Host "  [+] MODE:           GAMING OVERDRIVE (DEBLOATED)"
          Write-Host "===================================================="
          Write-Host "  [!] STATUS:         ONLINE (ULTRA-LOW LATENCY)"
          Write-Host "===================================================="
          Write-Host "  [!] DICA: Use o Windows App para conectar."
          Write-Host "===================================================="

      # =====================================================
      # 7. STATUS
      # =====================================================
      - name: Check Session
        run: |
          echo "=========================================="
          echo "Q4OS MOBILE SESSION"
          echo "=========================================="
          echo "User: $USERNAME"
          echo "Storage: $DISK_SIZE"
          echo "RAM: ${RAM}MB"
          echo "CPU: $CPUS"
          echo "=========================================="

      # =====================================================
      # 8. MANTER WORKFLOW ATIVO
      # =====================================================
      - name: Keep Session Alive
        run: |
          echo "SESSION ACTIVE."

          while true
          do
            if ! kill -0 "$(cat "$HOME/q4os/qemu.pid")" 2>/dev/null
            then
              echo "QEMU STOPPED."
              exit 1
            fi

            sleep 60
          done

      # =====================================================
      # 9. SALVAR LOGS
      # =====================================================
      - name: Save Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DeepHat-Q4OS-Logs
          path: |
            $HOME/q4os/qemu.log
            $HOME/q4os/novnc.log
          retention-days: 1
